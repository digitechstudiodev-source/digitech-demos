<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigiTech Studio | Apple Orchard Monitor Demo</title>
<!-- DigiTech Studio — Apple Orchard Monitor DEMO | Version 1.0 | Last modified: 09-Nov-2026 | Fictional data; no external backend -->
<style>
:root{--green:#20633a;--dark:#123d27;--mint:#e8f4eb;--bg:#f5f7f4;--line:#dce5dc;--ink:#1d2d23;--muted:#65746b;--red:#a63232;--amber:#9b620c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed)}.top{background:linear-gradient(120deg,#123d27,#287746);color:#fff;padding:16px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{margin:0;font-size:21px}.top small{opacity:.82}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ghost{background:#ffffff22;border:1px solid #ffffff66;color:white;padding:8px 11px;border-radius:9px}.demo{background:#ffdf8b;color:#573c00;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:800;letter-spacing:.06em}.tabs{display:flex;gap:4px;overflow:auto;background:#fff;border-bottom:1px solid var(--line);padding:7px max(12px,calc((100vw - 1180px)/2))}.tab{border:0;background:transparent;padding:11px 15px;border-radius:9px;white-space:nowrap;font-weight:650;color:#526458}.tab.active{background:var(--mint);color:var(--dark)}main{max-width:1180px;margin:auto;padding:22px 16px 60px}.headline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.headline h2{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.panel,.metric{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 3px 12px #153f2510}.metric strong{font-size:28px;display:block;color:var(--dark)}.metric span{font-size:12px;color:var(--muted)}.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-top:15px}.panel h3{margin:0 0 12px;font-size:16px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:13px}.toolbar input,.toolbar select,input,select,textarea{border:1px solid #cbd8cd;border-radius:9px;padding:10px;background:white;color:var(--ink);min-width:0}.toolbar input{flex:1;min-width:180px}.btn{border:1px solid var(--line);background:#fff;color:var(--dark);padding:9px 13px;border-radius:9px;font-weight:650}.primary{background:var(--green);border-color:var(--green);color:white}.danger{color:var(--red);border-color:#e9bdbd}.rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.plant{border:1px solid var(--line);border-radius:13px;background:white;text-align:left;padding:14px;transition:.15s}.plant:hover{border-color:#72a886;box-shadow:0 5px 15px #153f251c}.plant b{font-size:16px}.plant p{margin:5px 0;color:var(--muted)}.pill{display:inline-block;padding:3px 9px;border-radius:30px;font-size:11px;font-weight:700}.Healthy{background:#e1f2e5;color:#176236}.Watch{background:#fff0cf;color:#8c5b0c}.Action{background:#ffe4e2;color:#9b2828}.bar{display:flex;align-items:center;gap:10px;margin:11px 0}.bar label{width:110px;color:var(--muted);font-size:12px}.track{flex:1;height:12px;background:#eef1ed;border-radius:12px;overflow:hidden}.fill{height:100%;background:#3a9059;border-radius:12px}.bar strong{width:34px;text-align:right}.list-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.list-item:last-child{border:0}.muted{color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted)}.overlay{position:fixed;inset:0;background:#0b2117a8;display:none;justify-content:center;align-items:center;padding:14px;z-index:20}.overlay.open{display:flex}.modal{background:#fff;border-radius:17px;max-width:680px;width:100%;max-height:94vh;overflow:auto}.modal-head{background:var(--dark);color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}.modal-head h2{margin:0;font-size:18px}.modal-body{padding:18px}.close{border:0;background:#ffffff22;color:white;border-radius:8px;padding:5px 11px;font-size:20px}.navline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}.navline input{width:120px;flex:1}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.detail{background:#f4f8f4;border-radius:10px;padding:10px}.detail small{display:block;color:var(--muted)}.detail b{font-size:14px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-weight:600;font-size:12px}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.notice{padding:11px 13px;background:#fff6dd;border-radius:10px;color:#76500e;margin-bottom:15px;font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#213d2b;color:white;padding:12px 18px;border-radius:10px;display:none;z-index:40;box-shadow:0 5px 25px #0004}.timeline{max-height:260px;overflow:auto}.timeline article{border-left:3px solid #a9d2b4;padding:4px 12px 14px;margin-left:6px}.timeline small{color:var(--muted)}.footer{margin-top:24px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.rows{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.rows{grid-template-columns:1fr}.details{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top h1{font-size:18px}.modal-body{padding:12px}.navline .btn{padding:8px}.grid{gap:8px}.metric{padding:12px}.metric strong{font-size:23px}}
</style></head><body>
<header class="top"><div><small>DIGITECH STUDIO · AGRITECH</small><h1>🍎 Apple Orchard Monitor</h1><small>High-density M9 orchard · Interactive showcase</small></div><div class="top-actions"><span class="demo">DEMO · FICTIONAL DATA</span><button class="ghost" id="resetTop">↻ Reset Demo</button><button class="ghost" id="backWebsite">← Website</button></div></header>
<nav class="tabs" aria-label="App sections"><button class="tab active" data-page="dashboard">Dashboard</button><button class="tab" data-page="plants">Plant Register</button><button class="tab" data-page="alerts">Health Alerts</button><button class="tab" data-page="reports">Reports</button></nav>
<main><div id="content"></div><div class="footer">DigiTech Studio · Demonstration v1.0 · Updated 09-Nov-2026 · No real orchard data is used</div></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Plant profile"><div class="modal"><div class="modal-head"><div><small>PLANT PROFILE · SAMPLE DATA</small><h2 id="modalTitle">Plant</h2></div><button class="close" id="closeModal" aria-label="Close">×</button></div><div class="modal-body" id="modalBody"></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const VERSION='1.0 · 09-Nov-2026';
const KEY='digitech-orchard-demo-v1';
const VARIETIES=['Fenplus Gala','Schenico Red Gala','Red Gala','Gala Schniga'];
const TYPES=['Inspection','Pruning','Spraying','Fertigation','Flowering','Fruit Development','Harvest','Other'];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function seed(){const plants=[];for(let i=1;i<=100;i++){const id='M9-'+String(i).padStart(3,'0'),row='R'+Math.ceil(i/20),status=i%13===0?'Action':i%7===0?'Watch':'Healthy';plants.push({id,row,position:(i-1)%20+1,variety:VARIETIES[(i-1)%4],year:i<=60?2023:2024,status,height:125+(i*13)%95,fruit:5+(i*7)%23,notes:status==='Action'?'Inspect leaf condition and irrigation':status==='Watch'?'Monitor vigour and fruit set':'',events:[{date:'2026-03-18',type:'Pruning',note:'Dormant pruning completed'},{date:'2026-04-24',type:'Inspection',note:status==='Healthy'?'Healthy canopy and normal growth':'Flagged for follow-up'}]});}return plants;}
let plants;try{const stored=sessionStorage.getItem(KEY);const parsed=stored?JSON.parse(stored):null;plants=Array.isArray(parsed)&&parsed.length===100&&parsed.every(p=>p.id&&Array.isArray(p.events))?parsed:seed();}catch(e){plants=seed();}
let page='dashboard',selected=null,filterText='',filterRow='',filterStatus='',dirty=false;
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(plants));}catch(e){toast('Browser storage unavailable; changes last until page closes.');}}
function toast(message){const el=$('toast');el.textContent=message;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2700);}
function count(s){return plants.filter(p=>p.status===s).length;}
function badge(p){return `<span class="pill ${p.status}">${p.status==='Action'?'Needs Action':p.status==='Watch'?'Under Watch':'Healthy'}</span>`;}
function card(p){return `<button class="plant" data-open="${esc(p.id)}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.id)}</b>${badge(p)}</div><p>${esc(p.variety)}</p><small>Row ${esc(p.row)} · Position ${p.position} · ${p.year}</small></button>`;}
function dashboard(){const recent=plants.filter(p=>p.status!=='Healthy').slice(0,5);return `<div class="headline"><div><h2>Orchard Overview</h2><div class="sub">100 fictional plants across five trellised rows</div></div><button class="btn primary" data-page="plants">Explore Plant Cards →</button></div><div class="grid"><div class="metric"><strong>${plants.length}</strong><span>Total Plants</span></div><div class="metric"><strong>${count('Healthy')}</strong><span>Healthy</span></div><div class="metric"><strong>${count('Watch')}</strong><span>Under Watch</span></div><div class="metric"><strong>${count('Action')}</strong><span>Needs Action</span></div></div><div class="cols"><section class="panel"><h3>Plant Health Distribution</h3>${['Healthy','Watch','Action'].map(s=>`<div class="bar"><label>${s==='Action'?'Needs Action':s==='Watch'?'Under Watch':s}</label><div class="track"><div class="fill" style="width:${count(s)}%;background:${s==='Action'?'#cf5950':s==='Watch'?'#dfa73a':'#3a9059'}"></div></div><strong>${count(s)}</strong></div>`).join('')}<p class="sub">Indicators update as you edit plant profiles.</p></section><section class="panel"><h3>Recent Attention List</h3>${recent.map(p=>`<div class="list-item"><div><b>${esc(p.id)}</b><div class="sub">${esc(p.variety)} · ${esc(p.row)}</div></div><button class="btn" data-open="${esc(p.id)}">Open</button></div>`).join('')||'<div class="empty">No alerts</div>'}</section></div><section class="panel" style="margin-top:15px"><div class="headline"><h3 style="margin:0">Sample Plant Cards</h3><button class="btn" data-page="plants">View All</button></div><div class="rows">${plants.slice(0,6).map(card).join('')}</div></section>`;}
function plantPage(){const list=plants.filter(p=>(!filterRow||p.row===filterRow)&&(!filterStatus||p.status===filterStatus)&&(!filterText||[p.id,p.variety,p.row,String(p.position)].join(' ').toLowerCase().includes(filterText.toLowerCase())));return `<div class="headline"><div><h2>Plant Register</h2><div class="sub">Select a plant to view, edit, and record monitoring activities</div></div><span class="sub">${list.length} of 100 plants</span></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search ID, variety, row or position" value="${esc(filterText)}" aria-label="Search plants"><select id="rowFilter" aria-label="Filter row"><option value="">All rows</option>${[1,2,3,4,5].map(n=>`<option value="R${n}" ${filterRow==='R'+n?'selected':''}>Row R${n}</option>`).join('')}</select><select id="statusFilter" aria-label="Filter status"><option value="">All health</option>${['Healthy','Watch','Action'].map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${s==='Action'?'Needs Action':s==='Watch'?'Under Watch':s}</option>`).join('')}</select></div><div class="toolbar"><input id="jumpId" placeholder="Go directly to Plant ID (e.g. 42)" aria-label="Go to Plant ID"><button class="btn primary" id="jumpBtn">Go to Plant</button></div><div class="rows" id="plantResults">${list.map(card).join('')||'<div class="empty">No matching plants</div>'}</div></div>`;}
function alertPage(){const list=plants.filter(p=>p.status!=='Healthy');return `<div class="headline"><div><h2>Health Alerts</h2><div class="sub">Plants flagged for observation or action</div></div><span class="pill Action">${list.length} flagged</span></div><div class="panel">${list.map(p=>`<div class="list-item"><div><b>${esc(p.id)} · ${esc(p.variety)}</b><div class="sub">${esc(p.row)} · ${esc(p.notes||'Review plant health')}</div></div><div style="display:flex;gap:8px;align-items:center">${badge(p)}<button class="btn" data-open="${esc(p.id)}">Review</button></div></div>`).join('')||'<div class="empty">All plants are healthy.</div>'}</div>`;}
function reports(){const varieties=VARIETIES.map(v=>({v,n:plants.filter(p=>p.variety===v).length}));return `<div class="headline"><div><h2>Orchard Reports</h2><div class="sub">Live summaries from fictional demo records</div></div><button class="btn" id="exportCsv">Export Plant CSV</button></div><div class="cols"><section class="panel"><h3>By Row</h3>${[1,2,3,4,5].map(n=>`<div class="list-item"><b>Row R${n}</b><span>${plants.filter(p=>p.row==='R'+n).length} plants · ${plants.filter(p=>p.row==='R'+n&&p.status!=='Healthy').length} flagged</span></div>`).join('')}</section><section class="panel"><h3>By Variety</h3>${varieties.map(x=>`<div class="list-item"><b>${esc(x.v)}</b><span>${x.n} plants</span></div>`).join('')}</section></div><section class="panel" style="margin-top:15px"><h3>Monitoring Activity</h3><div class="grid"><div class="metric"><strong>${plants.reduce((n,p)=>n+p.events.length,0)}</strong><span>Total Activities</span></div><div class="metric"><strong>${plants.filter(p=>p.events.some(e=>e.type==='Inspection')).length}</strong><span>Inspected Plants</span></div><div class="metric"><strong>${plants.filter(p=>p.events.some(e=>e.type==='Spraying')).length}</strong><span>Sprayed Plants</span></div><div class="metric"><strong>${plants.filter(p=>p.events.some(e=>e.type==='Harvest')).length}</strong><span>Harvest Logged</span></div></div></section>`;}
function render(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));$('content').innerHTML=({dashboard,plants:plantPage,alerts:alertPage,reports})[page]();}
function go(id){let s=String(id||'').trim().toUpperCase();if(/^\d+$/.test(s))s='M9-'+s.padStart(3,'0');if(/^M9-\d+$/.test(s))s='M9-'+String(Number(s.slice(3))).padStart(3,'0');const p=plants.find(x=>x.id===s);if(!p){toast('Plant not found. Try an ID from 1 to 100.');return;}openPlant(p.id);}
function confirmLeave(){return !dirty||confirm('Discard unsaved profile changes and open another plant?');}
function openPlant(id){if(!confirmLeave())return;selected=id;dirty=false;drawModal();$('overlay').classList.add('open');}
function closeModal(){if(!confirmLeave())return;$('overlay').classList.remove('open');selected=null;dirty=false;render();}
function drawModal(){const p=plants.find(x=>x.id===selected);if(!p)return;const index=plants.indexOf(p);$('modalTitle').textContent=p.id+' · '+p.variety;const options=VARIETIES.map(v=>`<option ${v===p.variety?'selected':''}>${esc(v)}</option>`).join('');$('modalBody').innerHTML=`<div class="navline"><button class="btn" id="prevPlant" ${index===0?'disabled':''}>← Previous</button><input id="modalJump" placeholder="Plant ID / number" aria-label="Go to plant ID"><button class="btn primary" id="modalGo">Go</button><button class="btn" id="nextPlant" ${index===plants.length-1?'disabled':''}>Next →</button></div><div class="notice">Interactive demonstration only. Changes are stored in this browser tab and never sent to a real orchard database.</div><div class="details"><div class="detail"><small>Row</small><b>${esc(p.row)}</b></div><div class="detail"><small>Position</small><b>${p.position}</b></div><div class="detail"><small>Planting year</small><b>${p.year}</b></div></div><h3>Plant Profile</h3><form id="profileForm"><div class="formgrid"><div class="field"><label for="fVariety">Variety</label><select id="fVariety">${options}</select></div><div class="field"><label for="fStatus">Health Status</label><select id="fStatus">${['Healthy','Watch','Action'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s==='Action'?'Needs Action':s==='Watch'?'Under Watch':s}</option>`).join('')}</select></div><div class="field"><label for="fHeight">Height (cm)</label><input id="fHeight" type="number" min="0" max="1000" value="${p.height}" required></div><div class="field"><label for="fFruit">Estimated fruit count</label><input id="fFruit" type="number" min="0" max="10000" value="${p.fruit}" required></div><div class="field full"><label for="fNotes">Monitoring notes</label><textarea id="fNotes" rows="2">${esc(p.notes)}</textarea></div></div><div class="actions"><button type="submit" class="btn primary">Save Plant Changes</button></div></form><h3 style="margin-top:22px">Activity Timeline</h3><div class="timeline">${p.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<article><b>${esc(e.type)}</b> <small>${esc(e.date)}</small><div>${esc(e.note)}</div></article>`).join('')}</div><h3 style="margin-top:18px">Add Monitoring Activity</h3><form id="activityForm"><div class="formgrid"><div class="field"><label for="aDate">Date</label><input id="aDate" type="date" value="${today()}" required></div><div class="field"><label for="aType">Activity Type</label><select id="aType">${TYPES.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field full"><label for="aNote">Observation / action taken</label><textarea id="aNote" required maxlength="500" placeholder="Describe the activity"></textarea></div></div><div class="actions"><button class="btn primary" type="submit">Add Activity</button></div></form>`;
$('prevPlant').onclick=()=>index>0&&openPlant(plants[index-1].id);$('nextPlant').onclick=()=>index<plants.length-1&&openPlant(plants[index+1].id);$('modalGo').onclick=()=>{if(confirmLeave())go($('modalJump').value)};$('modalJump').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('modalGo').click()}};['fVariety','fStatus','fHeight','fFruit','fNotes'].forEach(id=>$(id).addEventListener('input',()=>dirty=true));
$('profileForm').onsubmit=e=>{e.preventDefault();const height=Number($('fHeight').value),fruit=Number($('fFruit').value);if(!Number.isFinite(height)||height<0||!Number.isFinite(fruit)||fruit<0){toast('Enter valid nonnegative measurements.');return;}p.variety=$('fVariety').value;p.status=$('fStatus').value;p.height=height;p.fruit=fruit;p.notes=$('fNotes').value.trim();dirty=false;save();drawModal();toast('Plant profile saved in this demo session.');};
$('activityForm').onsubmit=e=>{e.preventDefault();const note=$('aNote').value.trim();if(!note){toast('Enter an observation.');return;}p.events.push({date:$('aDate').value,type:$('aType').value,note});save();drawModal();toast('Monitoring activity added.');};}
function reset(){if(!confirm('Reset all 100 fictional plant records and remove your demo changes?'))return;plants=seed();save();dirty=false;selected=null;$('overlay').classList.remove('open');render();toast('Demo reset to original sample data.');}
function exportCSV(){const columns=['Plant ID','Row','Position','Variety','Planting Year','Status','Height cm','Fruit Count','Notes','Activity Count'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[columns,...plants.map(p=>[p.id,p.row,p.position,p.variety,p.year,p.status,p.height,p.fruit,p.notes,p.events.length])].map(r=>r.map(quote).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='DigiTech_Orchard_Demo_Plants.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('content').addEventListener('click',e=>{const btn=e.target.closest('[data-open],[data-page],#jumpBtn,#exportCsv');if(!btn)return;if(btn.dataset.open)openPlant(btn.dataset.open);else if(btn.dataset.page){page=btn.dataset.page;render();}else if(btn.id==='jumpBtn')go($('jumpId').value);else if(btn.id==='exportCsv')exportCSV();});
$('content').addEventListener('input',e=>{if(e.target.id==='search'){filterText=e.target.value;const list=plants.filter(p=>(!filterRow||p.row===filterRow)&&(!filterStatus||p.status===filterStatus)&&[p.id,p.variety,p.row,String(p.position)].join(' ').toLowerCase().includes(filterText.toLowerCase()));$('plantResults').innerHTML=list.map(card).join('')||'<div class="empty">No matching plants</div>';}});
$('content').addEventListener('change',e=>{if(e.target.id==='rowFilter'){filterRow=e.target.value;render();}if(e.target.id==='statusFilter'){filterStatus=e.target.value;render();}});
$('content').addEventListener('keydown',e=>{if(e.target.id==='jumpId'&&e.key==='Enter'){e.preventDefault();go(e.target.value);}});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{page=t.dataset.page;render();});$('resetTop').onclick=reset;$('closeModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal();};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('open'))closeModal();});
$('backWebsite').onclick=()=>{if(window.parent!==window){window.parent.postMessage({type:'DIGITECH_CLOSE_APP'},'*');toast('Returning to website…');}else if(document.referrer&&new URL(document.referrer).origin!==location.origin){location.href=document.referrer;}else{toast('Use your browser Back button to return to the website.');}};
render();
</script></body></html>
